<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.ico" />
    <title>Rosarito haciendo cosas</title>
    <meta name="description" content="Cositas hechas con three.js." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Rosarito haciendo cosas" />
    <meta property="og:description" content="Cositas hechas con three.js." />
    <meta property="og:url" content="https://rosariosm.github.io/rosaura10/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rosarito haciendo cosas" />
    <meta name="twitter:description" content="Cositas hechas con three.js." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0e11;
        --fg: #e9e6e1;
        --dim: #7b7784;
        --accent: #ff69b4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      main { width: 100%; max-width: 34rem; }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      p.sub { margin: 0 0 2.5rem; color: var(--dim); }
      ul { list-style: none; margin: 0; padding: 0; }
      li + li { margin-top: 0.75rem; }
      a, .soon {
        display: block;
        padding: 1rem 1.25rem;
        border: 1px solid #26242c;
        border-radius: 6px;
        text-decoration: none;
        color: inherit;
      }
      a:hover, a:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      .label { display: block; }
      .note { display: block; color: var(--dim); font-size: 0.85rem; }
      .soon { color: var(--dim); border-style: dashed; }
    </style>
  </head>
  <body>
    <main>
      <h1>rosaura10</h1>
      <p class="sub">cositas hechas con three.js.</p>
      <ul>
        <li>
          <a href="./v1/">
            <span class="label">v1 &middot; pa que te voy a decir que no si sí</span>
            <span class="note">Este es un hello world, lo hice hace <span data-since="2021-01-29">5</span> años. Nunca le puse amor, solo memes.</span>
          </a>
        </li>
        <li>
          <a href="./v2/">
            <span class="label">v2 &middot; mis pelos</span>
            <span class="note">Ahora se me dio por animar pelos, qué sé yo. ¿Animaré algo más?</span>
          </a>
        </li>
      </ul>
    </main>
    <script>
      for (const el of document.querySelectorAll("[data-since]")) {
        const since = new Date(el.dataset.since);
        const now = new Date();
        const anniversary = new Date(now.getFullYear(), since.getMonth(), since.getDate());
        el.textContent = now.getFullYear() - since.getFullYear() - (now < anniversary ? 1 : 0);
      }
    </script>
  </body>
</html>
